[package]
name = "viewstamp-proto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Sans-I/O state machine for the Viewstamped Replication protocol"

[features]
default = ["std"]
# `std` and `alloc` are INDEPENDENT: in `std` mode the real `std` crate already
# provides the heap, so `std` must NOT pull in `alloc`. The crate requires the
# heap, so its minimal viable config is `alloc` (the bare no-feature build does
# not compile — that is the intended signal).
alloc = []
std = ["bytes/std", "buffa/std"]
# Network transport, folded in as feature-gated modules (additive over the core).
# `tcp` is no_std+alloc; no new REQUIRED deps. `tls` adds the rustls record layer,
# implies `tcp` (reuses the framing/Conn/router) and `std` (rustls is std-only).
tcp = ["alloc"]
tls = ["tcp", "std", "dep:rustls"]
tls-rustls-ring = ["tls", "rustls/ring", "quinn-proto?/rustls-ring"]
tls-rustls-aws-lc-rs = ["tls", "rustls/aws_lc_rs", "quinn-proto?/rustls-aws-lc-rs"]
tls-rustls-aws-lc-rs-fips = ["tls", "rustls/fips", "quinn-proto?/rustls-aws-lc-rs-fips"]
# QUIC transport (std-only, like `tls`). The crypto provider is the SINGLE
# source of truth shared with `tls-*`: selecting a provider drives BOTH layers.
quic = ["tcp", "std", "dep:quinn-proto", "dep:x509-parser"]

[dependencies]
bytes = { workspace = true }
buffa = { workspace = true }
derive_more = { workspace = true, features = ["display", "is_variant", "unwrap", "try_unwrap"] }
thiserror = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
# The QUIC bridge sizes its stream receive window against `MAX_CHUNKS`, a private constant in
# quinn-proto's `connection/assembler.rs` that no API exposes, so a release is free to move that
# ceiling. Drift is caught by tests rather than held off by a version pin:
# `a_full_stream_window_of_unread_packets_stays_within_the_reassembly_bound` and
# `a_class_batch_leaves_as_one_sub_packet_span_per_packetizing_pass` pin the sizing,
# `a_sub_packet_flood_makes_the_bridge_emit_the_lost_event_for_the_refused_stream` pins compaction and
# refusal (receiver-side span count, past the compaction threshold), and the three unsolicited-half tests (`sub_packet_writes_...`, `gapped_writes_...`,
# `data_whose_reset_lands_in_the_same_batch_...`) pin the classifier that rests on the same private
# behaviour. This crate's CI resolves fresh and runs the whole QUIC suite against each new 0.11.x; an
# embedder who pins or upgrades quinn-proto themselves should run that suite as the compatibility
# check — the named tests say what a failure means, they are not a subset to run instead (both the
# sizing and the classifier were verified against 0.11.17).
quinn-proto = { version = "0.11", default-features = false, optional = true }
x509-parser = { version = "0.18", default-features = false, optional = true }

[build-dependencies]
buffa-build.workspace = true

[dev-dependencies]
criterion = "0.8"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "commit_loop"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
