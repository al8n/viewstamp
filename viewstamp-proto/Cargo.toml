[package]
name = "viewstamp-proto"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/viewstamp"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Sans-I/O state machine for the Viewstamped Replication protocol"

[features]
default = ["std"]
# `std` and `alloc` are INDEPENDENT: in `std` mode the real `std` crate already
# provides the heap, so `std` must NOT pull in `alloc`. The crate requires the
# heap, so its minimal viable config is `alloc` (the bare no-feature build does
# not compile — that is the intended signal).
alloc = []
std = ["bytes/std"]
# Network transport, folded in as feature-gated modules (additive over the core).
# `tcp` is no_std+alloc; no new REQUIRED deps. `tls` adds the rustls record layer,
# implies `tcp` (reuses the framing/Conn/router) and `std` (rustls is std-only).
tcp = ["alloc"]
tls = ["tcp", "std", "dep:rustls"]
tls-rustls-ring = ["tls", "rustls/ring", "quinn-proto?/rustls-ring"]
tls-rustls-aws-lc-rs = ["tls", "rustls/aws_lc_rs", "quinn-proto?/rustls-aws-lc-rs"]
tls-rustls-aws-lc-rs-fips = ["tls", "rustls/fips", "quinn-proto?/rustls-aws-lc-rs-fips"]
# QUIC transport (std-only, like `tls`). The crypto provider is the SINGLE
# source of truth shared with `tls-*`: selecting a provider drives BOTH layers.
quic = ["tcp", "std", "dep:quinn-proto", "dep:x509-parser"]

[dependencies]
bytes = { workspace = true }
derive_more = { workspace = true, features = ["display", "is_variant", "unwrap", "try_unwrap"] }
thiserror = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
quinn-proto = { version = "0.11", default-features = false, optional = true }
x509-parser = { version = "0.18", default-features = false, optional = true }

[dev-dependencies]
# Carries the workspace's time resolution bound into every graph that builds rcgen (see the
# workspace manifest's comment).
time = { workspace = true }
criterion = "0.8"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", features = ["ring"] }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "commit_loop"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
