[workspace]
members = [
  "viewstamp-proto",
  "viewstamp-driver",
  "viewstamp-compio",
  "viewstamp-reactor",
  "tests/viewstamp-simulation",
]
# The fuzz harness is its own nested workspace (nightly + libFuzzer instrumentation); keep it out
# of the stable workspace and its feature-powerset sweeps.
exclude = ["fuzz"]
resolver = "3"

[workspace.dependencies]
viewstamp-proto = { path = "viewstamp-proto", version = "0.0.0" }
viewstamp-driver = { path = "viewstamp-driver", version = "0.0.0", default-features = false }
bytes = { version = "1", default-features = false }
derive_more = { version = "2", default-features = false }
thiserror = { version = "2", default-features = false }
smol_str = "0.3"
agnostic = { version = "0.9", default-features = false }
agnostic-lite = { version = "0.6", default-features = false }
compio = { version = "0.19", default-features = false }
flume = { version = "0.12", default-features = false, features = ["async"] }
futures-channel = { version = "0.3.32", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio = { version = "1", default-features = false }
viewstamp-simulation = { path = "tests/viewstamp-simulation", version = "0.0.0" }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
