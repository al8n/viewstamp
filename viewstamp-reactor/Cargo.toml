[package]
name = "viewstamp-reactor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Reactor-I/O (tokio/smol via agnostic) driver for viewstamp-proto"

[features]
# Pull in a concrete `agnostic` runtime for embedders that want one wired here; the driver itself
# is generic over any `agnostic::Runtime` and needs neither feature to compile.
tokio = ["agnostic/tokio"]
smol = ["agnostic/smol"]

[dependencies]
viewstamp-proto = { workspace = true, features = ["std", "quic", "tls-rustls-ring"] }
viewstamp-driver = { workspace = true }
agnostic = { workspace = true, features = ["net"] }
agnostic-lite = { workspace = true, features = ["time"] }
bytes = { workspace = true, features = ["std"] }
flume = { workspace = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
# Peer-socket options the agnostic traits do not surface directly (SO_KEEPALIVE,
# TCP_USER_TIMEOUT); reached through the sockets' std fd traits. `all` unlocks the
# platform-specific setters (TCP_USER_TIMEOUT).
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
viewstamp-simulation = { workspace = true }
agnostic = { workspace = true, features = ["net", "tokio"] }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[[test]]
name = "loopback"
required-features = ["tokio"]

[[test]]
name = "stream_loopback"
required-features = ["tokio"]

[[test]]
name = "batching_loopback"
required-features = ["tokio"]

[[test]]
name = "reconfigure_loopback"
required-features = ["tokio"]

[[example]]
name = "three_node"
required-features = ["tokio"]

[lints]
workspace = true
