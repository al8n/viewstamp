[package]
name = "vsrr-proto"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/al8n/vsrr"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Sans-I/O state machine for the Viewstamped Replication protocol"

[features]
default = ["std"]
alloc = []
std = ["alloc", "bytes/std"]

[dependencies]
bytes = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
thiserror = { workspace = true }

[dev-dependencies]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
