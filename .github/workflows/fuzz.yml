name: fuzz

# Short scheduled fuzz runs over the byte-decode surfaces (fuzz/fuzz_targets/): Message::decode,
# the stream-transport ingress (the frame decoder fed arbitrary chunkings through the public
# coordinator API), and the superblock/WAL disk codec. Each target runs briefly from the committed
# seed corpus — a smoke lane that catches a decode panic/regression, not a deep campaign; run
# longer sessions locally with `cargo +nightly fuzz run <target>`. Weekly + on demand, vopr-style:
# heavier than the per-PR path and not tied to any one PR.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Per-target run time in seconds (default 300)"
        required: false
        default: "300"
  schedule:
    - cron: "0 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # cargo-fuzz composes its sanitizer RUSTFLAGS onto this env value, and a set RUSTFLAGS makes
  # cargo ignore the config-file rustflags — which is where the workspace's `.cargo/config.toml`
  # injects this cfg. Without re-stating it here the fuzz build of viewstamp-simulation loses its
  # testkit-gated accessors (E0599 on Endpoint::state_machine_ref).
  RUSTFLAGS: "--cfg vsrr_internal_testkit"

jobs:
  fuzz:
    name: fuzz (libFuzzer, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-
      - name: Install nightly
        run: rustup update nightly --no-self-update && rustup default nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl-static binary, and without an explicit --target it builds
      # the fuzz targets for ITS OWN host triple (x86_64-unknown-linux-musl) — where the address
      # sanitizer has no std/core (E0463). Every run below pins the GNU target instead.
      - name: Fuzz message_decode
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '300' }}
        run: cargo fuzz run message_decode --target x86_64-unknown-linux-gnu -- -max_total_time=$SECONDS_PER_TARGET
      - name: Fuzz stream_ingress
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '300' }}
        run: cargo fuzz run stream_ingress --target x86_64-unknown-linux-gnu -- -max_total_time=$SECONDS_PER_TARGET
      - name: Fuzz superblock_decode
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '300' }}
        run: cargo fuzz run superblock_decode --target x86_64-unknown-linux-gnu -- -max_total_time=$SECONDS_PER_TARGET
      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
