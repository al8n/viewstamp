name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  pull_request:
    paths-ignore:
      - 'README'
      - 'COPYRIGHT'
      - 'LICENSE-*'
      - '**.md'
      - '**.txt'
  workflow_dispatch:
  schedule: [cron: "0 1 */7 * *"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings --cfg vsrr_internal_testkit
  RUST_BACKTRACE: 1
  nightly: nightly
  stable: stable

# The aws-lc-rs and aws-lc-rs-fips rustls providers need a C/CMake/NASM (and, for FIPS, Go)
# toolchain that the macOS/Windows runners do not have; tls-rustls-ring is pure-Rust+asm and
# builds on every platform, so it is the provider exercised in CI. The cargo-hack feature sweeps
# below exclude the two aws-lc-rs features for that reason. The `quic` feature is also excluded
# from the sweeps because it mandates a crypto provider (a `compile_error!` rejects `quic` with no
# provider, by design), so it cannot build standalone; each sweep job builds, lints, and tests it
# explicitly via `quic,tls-rustls-ring`.
jobs:
  # Check formatting
  rustfmt:
    name: rustfmt
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check


  # Apply clippy lints
  clippy:
    name: clippy
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy --each-feature --exclude-no-default-features --exclude-features quic,tls-rustls-aws-lc-rs,tls-rustls-aws-lc-rs-fips
    - name: Clippy the quic transport with an explicit crypto provider
      run: cargo clippy -p viewstamp-proto --no-default-features --features quic,tls-rustls-ring

  # Run tests on some extra platforms
  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          # - mips64-unknown-linux-gnuabi64
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build --target ${{ matrix.target }}
        # The portable core only: the compio driver crate is native-only (io_uring/kqueue/IOCP)
        # and pulls C crypto that needs a per-target cross toolchain.
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --target ${{ matrix.target }} -p viewstamp-proto

  # Prove the declared MSRV (rust-version in every crate's Cargo.toml) actually compiles the
  # feature set CI ships. The MSRV-aware resolver (workspace resolver = "3") picks 1.95-compatible
  # dependency versions on its own, so this is a plain check on the old toolchain: the workspace on
  # default features, plus viewstamp-proto with the full portable feature union (the powerset is
  # stable-toolchain territory in `build`/`test`; MSRV needs the additive union, exercised once).
  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Rust 1.95
      run: rustup toolchain install 1.95 --profile minimal && rustup default 1.95
    - name: Check the workspace on the MSRV
      run: cargo check --workspace
    - name: Check viewstamp-proto's portable feature union on the MSRV
      run: cargo check -p viewstamp-proto --features alloc,tcp,tls,tls-rustls-ring,quic

  # Hold rustdoc to the same -D warnings bar the code is held to (broken intra-doc links are the
  # usual offender). Same provider/feature selection as the sweeps: tls-rustls-ring, quic enabled
  # explicitly. ubuntu-only — rustdoc output is platform-independent.
  docs:
    name: docs (rustdoc -D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: cargo doc viewstamp-proto
      run: cargo doc --no-deps -p viewstamp-proto --features quic,tcp,tls,tls-rustls-ring
    - name: cargo doc viewstamp-compio
      run: cargo doc --no-deps -p viewstamp-compio
    - name: cargo doc viewstamp-driver
      run: cargo doc --no-deps -p viewstamp-driver
    - name: cargo doc viewstamp-reactor
      run: cargo doc --no-deps -p viewstamp-reactor
    - name: cargo doc viewstamp-simulation
      run: cargo doc --no-deps -p viewstamp-simulation
    # The facade crate's docs ARE its README (include_str) — the one crate whose intra-doc links
    # only rustdoc can check, and docs.rs will build it at publish.
    - name: cargo doc viewstamp
      run: cargo doc --no-deps -p viewstamp --features quic,tcp,tls,tls-rustls-ring,tokio,smol,compio

  # Licenses / security advisories / bans / sources over the whole dependency graph; the policy
  # (and the documented allowances) lives in deny.toml at the workspace root.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - name: Run cargo deny
      # A fresh lockfile so the check sees the resolution the declared rust-version actually
      # produces (a restored cache could otherwise pin dependencies resolved under an older MSRV).
      run: cargo generate-lockfile && cargo deny check

  # Prove the no_std core (viewstamp-proto) links on a real bare-metal target with
  # only `alloc` and no `std`. Any accidental std dependency fails to build here.
  no-std:
    name: no-std (bare-metal + alloc)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Add bare-metal no_std target
      run: rustup target add thumbv7em-none-eabi
    - name: Build viewstamp-proto (no_std + alloc) on bare metal
      run: cargo build -p viewstamp-proto --no-default-features --features alloc --target thumbv7em-none-eabi
    - name: Clippy viewstamp-proto (no_std + alloc)
      run: cargo clippy -p viewstamp-proto --no-default-features --features alloc -- -D warnings

  build:
    name: build
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run build
      run: cargo hack build --feature-powerset --exclude-no-default-features --exclude-features quic,tls-rustls-aws-lc-rs,tls-rustls-aws-lc-rs-fips
    - name: Build the quic transport with an explicit crypto provider
      run: cargo build -p viewstamp-proto --no-default-features --features quic,tls-rustls-ring

  test:
    name: test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-test-
    - name: Install Rust
      # --no-self-update is necessary because the windows environment cannot self-update rustup.exe.
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Cache ~/.cargo
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: ${{ runner.os }}-coverage-dotcargo
    - name: Run test
      run: cargo hack test --feature-powerset --exclude-no-default-features --exclude-features quic,tls-rustls-aws-lc-rs,tls-rustls-aws-lc-rs-fips
    - name: Test the quic transport with an explicit crypto provider
      run: cargo test -p viewstamp-proto --no-default-features --features quic,tls-rustls-ring

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - clippy
      - build
      - cross
      - test
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Cache ~/.cargo
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-coverage-dotcargo
      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-coverage-cargo-build-target
      - name: Run llvm-cov
        env:
          RUSTFLAGS: "--cfg vsrr_internal_testkit -Dwarnings"
        run: cargo llvm-cov -p viewstamp-proto --features quic,tcp,tls,tls-rustls-ring --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: lcov.info
          fail_ci_if_error: false
