[package]
name = "viewstamp-driver"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Runtime-agnostic driver core shared by the viewstamp drivers"

[dependencies]
derive_more = { workspace = true, features = ["display", "is_variant"] }
viewstamp-proto = { workspace = true, features = ["std", "tcp"] }
bytes = { workspace = true, features = ["std"] }
flume = { workspace = true }
futures-channel = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
futures-util = { workspace = true }
viewstamp-simulation = { workspace = true }

[lints]
workspace = true
